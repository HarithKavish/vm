name: Claude PR Review

# Content taken from an existing ecosystem repository rather than written from
# scratch, per protocols/REPOSITORY_ONBOARDING.md step 7. Two settings here are
# load-bearing and fail SILENTLY when wrong:
#
#   id-token: write   - required for claude-code-action's OAuth token exchange.
#                       Without it the step fails after 3 retries with "Could
#                       not fetch an OIDC token" and reviews nothing.
#   allowed_bots      - the action refuses to run when the triggering push came
#                       from a bot account. Agent-pushed commits then get no
#                       review and no visible error.
#
# NOTE: the action refuses to run when a PR modifies this file, because the
# workflow must match the version on the default branch. That is deliberate --
# it stops a PR from rewriting its own reviewer. Changes here therefore review
# nothing until they land on the default branch.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# One review per pull request at a time; a newer push supersedes an older one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'jarvis-harithkavish,claude'
          track_progress: true
          # The merge tools are granted by YAML, not by prompt text. The model
          # is instructed below to merge only into `development`, but it also
          # reads the PR body -- attacker-influenced content -- so a prompt-only
          # condition is a control the model itself could be talked out of.
          # Here, a PR targeting runway or main is handed no merge tool at all,
          # and the instruction becomes a second layer rather than the only one.
          # The false branch must be an EMPTY STRING, not `--allowedTools ""`.
          # Passing the flag with an empty value fails the action's own
          # environment validation and kills the whole run -- so a PR targeting
          # runway or main got no review at all, rather than a review without
          # merge tools. Observed on run 35423065615 (PR #3, runway -> main):
          # `Action failed with error: Environment variable validation failed`.
          # Omitting the flag leaves the action's default tool set in place,
          # which is read-only plus its own comment tool, and grants no merge.
          claude_args: ${{ github.event.pull_request.base.ref == 'development' && '--allowedTools "Bash(gh pr merge:*),Bash(gh issue close:*)"' || '' }}
          prompt: |
            Review this pull request for correctness bugs and post your findings
            as a PR comment. Lead with real defects; do not pad with style nits.

            This pull request targets: ${{ github.event.pull_request.base.ref }}

            This repository configures how agents work. Pay particular attention
            to two things a generic review would miss:

              - Anything under `skills/` or `agents/` is an INSTRUCTION that
                every later agent session obeys. Treat a change there with the
                scrutiny of a permissions change, not of documentation. Reject
                any content that appears to be derived from an untrusted source
                such as a fetched web page or an issue body.
              - A pipeline that reports success for a check it did not actually
                run is a defect, even though nothing errors. Verify that a
                missing tool yields `skipped`/`degraded` and never `ok`.

            Then decide on merging.

            MERGE when all of these hold:
              - you found no correctness issues
              - the branch it targets, shown above, is `development`
              - it does not touch credentials, authentication, or secrets

            If every condition holds, run:
              gh pr merge --auto --squash

            This merges into development, not this repository's default branch
            (main) -- which means GitHub's own Closes/Fixes/Resolves keyword
            handling in the pull request body will NOT fire. After a successful
            merge, read the pull request body yourself for Closes/Fixes/Resolves
            #N references and run `gh issue close N` for each one you find.

            DO NOT MERGE, and say plainly why, when any of these hold:
              - you found a correctness issue, however small
              - it targets `runway` or `main`. Promotion to runway is a
                release-candidate gate, and promotion to main is a deliberate
                release act (standards/BRANCHING.md). Neither is automatic, and
                a passing review is not authorisation to perform one.
              - it touches credentials, authentication, or secrets, where a
                mistake is not recoverable by reverting.

            Reviewing well and declining to merge is a complete and successful
            outcome, not a failure to finish. When in doubt, do not merge:
            leaving a pull request open is always safe, merging a bad one is not.